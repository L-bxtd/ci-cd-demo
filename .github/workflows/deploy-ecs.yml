# 实验四：Git push 到 main 后自动构建前后端并部署
# 说明：按实验要求原方案为部署阿里云 ECS；本环境以本地 VMware 虚拟机（Ubuntu Server 24.04，
# self-hosted runner + nginx + systemd）等效替代 ECS，部署流程与 ECS 版一致：
# 按 SHA 建目录 -> 生产依赖安装 -> 原子切换 current -> systemd 重启 -> 健康检查 -> 失败回滚。
name: Build and Deploy Full Stack to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecs-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test frontend
        working-directory: apps/frontend
        run: |
          npm ci
          CI=true npm test --if-present
          npm run build

      - name: Build and test backend
        working-directory: apps/backend
        run: |
          npm ci
          CI=true npm test --if-present
          npm run build
          test -f dist/server.js

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            apps/backend/dist/
            apps/backend/package.json
            apps/backend/package-lock.json

  deploy:
    runs-on: self-hosted
    needs: build
    timeout-minutes: 15
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: artifacts/backend

      - name: Stage release, activate, check health, rollback if needed
        run: |
          set -euo pipefail
          release="/srv/cicd-demo/releases/${GITHUB_SHA}"
          previous="$(readlink -f /srv/cicd-demo/current || true)"

          mkdir -p "$release/frontend" "$release/backend/dist"
          cp -a artifacts/frontend/. "$release/frontend/"
          cp -a artifacts/backend/dist/. "$release/backend/dist/"
          cp -a artifacts/backend/package.json artifacts/backend/package-lock.json "$release/backend/"

          cd "$release/backend"
          npm ci --omit=dev
          ln -sfn "$release" /srv/cicd-demo/current.next
          mv -Tf /srv/cicd-demo/current.next /srv/cicd-demo/current

          if ! sudo -n /usr/bin/systemctl restart cicd-demo || \
             ! curl -fsS --retry 5 --retry-connrefused --retry-delay 2 \
               http://127.0.0.1:3000/health; then
            echo 'Deployment failed; restoring previous release' >&2
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              ln -sfn "$previous" /srv/cicd-demo/current.next
              mv -Tf /srv/cicd-demo/current.next /srv/cicd-demo/current
              sudo -n /usr/bin/systemctl restart cicd-demo
            fi
            exit 1
          fi
          echo "Deployed commit ${GITHUB_SHA} successfully"
